name: Vérification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôle des compétences et manifestes
        run: |
          sortie="$(python verifier.py 2>&1)"
          if [ -n "$sortie" ]; then
            echo "$sortie" >&2
            exit 1
          fi
