    <!-- Open civil code base -->
    <path d="M22 96 C36 90 50 90 64 96 C78 90 92 90 106 96" stroke="#4F46E5" />
    <path d="M22 106 C36 100 50 100 64 106 C78 100 92 100 106 106" stroke="#6366F1" />
