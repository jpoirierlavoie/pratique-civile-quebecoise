    <line x1="28" y1="34" x2="100" y2="34" stroke="#F59E0B" />
    <circle cx="64" cy="24" r="4" stroke="#F59E0B" />
    <!-- Left pan -->
    <path d="M28 34 L18 62 L38 62 Z" stroke="#6366F1" />
    <path d="M18 62 C20 71 36 71 38 62" stroke="#F59E0B" />
    <!-- Right pan -->
